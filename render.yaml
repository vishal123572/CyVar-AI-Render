services:
  - type: web
    name: cyvar-ai-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyvar-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: LLM_PROVIDER
        value: none
      - key: SEED_DEMO_DATA
        value: "true"
databases:
  - name: cyvar-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: cyvar_db
    user: cyvar
    ipAllowList: []
